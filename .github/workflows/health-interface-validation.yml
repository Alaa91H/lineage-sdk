name: HealthInterface service recovery validation

on:
  pull_request:
    branches:
      - cnb
      - "fix/health-interface-*"
    paths:
      - "sdk/src/java/lineageos/health/HealthInterface.java"
      - "tools/validate_health_interface.py"
      - ".github/workflows/health-interface-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: HealthInterface recovery invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate checker syntax
        run: python3 -m py_compile tools/validate_health_interface.py

      - name: Validate binder recovery
        run: python3 tools/validate_health_interface.py

      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
