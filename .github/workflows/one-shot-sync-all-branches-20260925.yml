name: One-shot sync all branches

on:
  push:
    paths:
      - '.github/workflows/one-shot-sync-all-branches-20260925.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync every branch with default branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_PATH: .github/workflows/one-shot-sync-all-branches-20260925.yml
        shell: bash
        run: |
          set -u
          echo "Default branch: $DEFAULT_BRANCH"

          workflow_sha="$(gh api "repos/$REPO/contents/$WORKFLOW_PATH?ref=$DEFAULT_BRANCH" --jq '.sha')"
          gh api --method DELETE "repos/$REPO/contents/$WORKFLOW_PATH" \
            -f message='chore: remove temporary branch sync workflow [skip ci]' \
            -f sha="$workflow_sha" \
            -f branch="$DEFAULT_BRANCH" >/dev/null
          echo "Temporary workflow removed before synchronization."

          failures=0
          total=0
          synced=0
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            [ "$branch" = "$DEFAULT_BRANCH" ] && continue
            total=$((total + 1))
            echo "::group::Sync $branch"
            if gh api --method POST "repos/$REPO/merges" \
              -f base="$branch" \
              -f head="$DEFAULT_BRANCH" \
              -f commit_message="chore: sync $branch with $DEFAULT_BRANCH" >/tmp/merge.json 2>/tmp/merge.err; then
              synced=$((synced + 1))
              echo "Synced or already current: $branch"
            else
              failures=$((failures + 1))
              echo "::warning title=Branch sync failed::$branch could not be merged with $DEFAULT_BRANCH"
              cat /tmp/merge.err || true
            fi
            echo "::endgroup::"
          done < <(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name')

          echo "SYNC_TOTAL=$total"
          echo "SYNC_SUCCESS=$synced"
          echo "SYNC_FAILED=$failures"
          if [ "$failures" -gt 0 ]; then
            echo "::warning title=Synchronization completed with conflicts::$failures branch(es) require manual conflict resolution."
          fi