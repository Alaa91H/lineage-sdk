name: One-shot resolve branch sync conflicts

on:
  push:
    paths:
      - '.github/workflows/one-shot-resolve-sync-conflicts-20260925.yml'

permissions:
  contents: write

jobs:
  resolve-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge default branch while preserving branch-side conflicts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_PATH: .github/workflows/one-shot-resolve-sync-conflicts-20260925.yml
        shell: bash
        run: |
          set -u

          workflow_sha="$(gh api "repos/$REPO/contents/$WORKFLOW_PATH?ref=$DEFAULT_BRANCH" --jq '.sha')"
          gh api --method DELETE "repos/$REPO/contents/$WORKFLOW_PATH" \
            -f message='chore: remove temporary conflict-sync workflow [skip ci]' \
            -f sha="$workflow_sha" \
            -f branch="$DEFAULT_BRANCH" >/dev/null

          gh auth setup-git
          git clone --no-checkout "https://github.com/$REPO.git" repo
          cd repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "+refs/heads/*:refs/remotes/origin/*"

          total=0
          synced=0
          failed=0
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            total=$((total + 1))
            echo "::group::Resolve $branch"
            git reset --hard >/dev/null 2>&1 || true
            git clean -fdx >/dev/null 2>&1 || true
            git checkout -B sync-work "origin/$branch"

            if git merge --no-edit -X ours "origin/$DEFAULT_BRANCH"; then
              :
            else
              mapfile -d '' conflicts < <(git diff --name-only --diff-filter=U -z)
              for path in "${conflicts[@]}"; do
                if git checkout --ours -- "$path" 2>/dev/null; then
                  git add -- "$path"
                else
                  git rm -f --ignore-unmatch -- "$path" >/dev/null 2>&1 || true
                fi
              done
              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "::warning title=Unresolved branch::$branch still has unresolved paths"
                failed=$((failed + 1))
                git merge --abort >/dev/null 2>&1 || true
                echo "::endgroup::"
                continue
              fi
              git commit --no-edit || git commit -m "chore: sync $branch with $DEFAULT_BRANCH (preserve branch conflicts)"
            fi

            if git push origin "HEAD:refs/heads/$branch"; then
              synced=$((synced + 1))
              echo "Resolved and synced: $branch"
            else
              failed=$((failed + 1))
              echo "::warning title=Push failed::$branch could not be updated"
            fi
            echo "::endgroup::"
          done <<'BRANCHES'
          charging-control-schedule-recharge-level
          fix/charging-control-runtime-stability
          BRANCHES

          echo "RESOLVE_TOTAL=$total"
          echo "RESOLVE_SUCCESS=$synced"
          echo "RESOLVE_FAILED=$failed"